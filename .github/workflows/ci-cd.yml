name: CI/CD

on:
  push:
    branches: [ main ]

jobs:
  test:
    name: Testes unitários
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Rodar testes
        run: |
          n=0
          until [ $n -ge 3 ]; do
            ./mvnw -B test && break
            n=$((n+1))
            echo "Tentativa $n falhou, aguardando antes de tentar novamente..."
            sleep 10
          done
          [ $n -lt 3 ]

  sonar:
    name: SonarQube
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Cache SonarQube packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build, testes com cobertura e análise SonarQube
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          n=0
          until [ $n -ge 3 ]; do
            ./mvnw -B verify sonar:sonar && break
            n=$((n+1))
            echo "Tentativa $n falhou, aguardando antes de tentar novamente..."
            sleep 10
          done
          [ $n -lt 3 ]

  deploy:
    name: Deploy via Dokploy
    needs: sonar
    runs-on: ubuntu-latest
    environment: production
    steps:
    - name: Disparar webhook de deploy do Dokploy
      run: |
        status=$(curl -sS -o resp.txt -w "%{http_code}" -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -H "X-GitHub-Event: push" \
          -d '{"ref":"refs/heads/main","repository":{"full_name":"${{ github.repository }}"}}')
        echo "HTTP $status"
        cat resp.txt
        [ "$status" -lt 400 ]
