spring:
  application:
    name: api

  profiles:
    default: dev

  threads:
    virtual:
      enabled: true
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mydatabase}
    username: ${DATABASE_USERNAME:myuser}
    password: ${DATABASE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

app:
  jwt:
    public-key: ${JWT_PUBLIC_KEY:file:certs/jwt-public.pem}
    private-key: ${JWT_PRIVATE_KEY:file:certs/jwt-private.pem}
  rate-limit:
    trusted-proxies: ${TRUSTED_PROXIES:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  tomcat:
    accesslog:
      enabled: true
      directory: /dev
      prefix: stdout
      suffix: ''
      file-date-format: ''
      rotate: false
      buffered: false
      pattern: '%h "%r" %s %b %Dms'