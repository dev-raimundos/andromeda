spring:
  application:
    name: api

  profiles:
    default: dev

  threads:
    virtual:
      enabled: true

  # Loads the .env file from the project root when running via IDE/Maven.
  # Real environment variables (e.g. Docker Compose) take precedence.
  config:
    import: optional:file:.env[.properties]

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mydatabase}
    username: ${DATABASE_USERNAME:myuser}
    password: ${DATABASE_PASSWORD:secret}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# API documentation (Swagger/OpenAPI) disabled by default.
# Re-enabled only in the "dev" profile (see application-dev.yaml).
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
