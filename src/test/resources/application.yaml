spring:
  datasource:
    url: jdbc:h2:mem:testdb;DATABASE_TO_UPPER=FALSE;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none

  cache:
    type: none

app:
  jwt:
    public-key: file:target/test-keys/public.pem
    private-key: file:target/test-keys/private.pem
  cors:
    allowed-origins: http://localhost:4200
