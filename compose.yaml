services:
  redis:
    image: 'redis:alpine'
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  app:
    build: .
    ports:
      - '8080:8080'
    environment:
      - DATABASE_URL=${DATABASE_URL:-jdbc:postgresql://host.docker.internal:5432/mydatabase}
      - DATABASE_USERNAME=${DATABASE_USERNAME:-myuser}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-secret}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/v3/api-docs || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

volumes:
  redis_data:
