services:
  app:
    profiles: ["prod"]
    build: .
    ports:
      - '${APP_PORT:-8080}:8080'
    environment:
      - SPRING_PROFILES_ACTIVE=${SPRING_PROFILES_ACTIVE:-dev}
      - DATABASE_URL=${DATABASE_URL:?defina DATABASE_URL no .env}
      - DATABASE_USERNAME=${DATABASE_USERNAME:?defina DATABASE_USERNAME no .env}
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:?defina DATABASE_PASSWORD no .env}
      - FLYWAY_ENABLED=${FLYWAY_ENABLED:-true}
      - REDIS_HOST=${REDIS_HOST:?defina REDIS_HOST no .env}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 25s

